<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="C_ljrqHnRjb8wpxP6RHyDYpgQ6taIslqtZnTxd491-8" />
    <title>Raas Mandal</title>
    <script>
      // Intro (§5.14): keep the site hidden on black until the intro is up, so it doesn't flash first.
      // Same 1024 px test as src/ui/intro.ts (narrow windows skip the intro).
      if (innerWidth >= 1024) document.documentElement.classList.add("intro-pending");
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23f2a51a%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%227%22 fill=%22%234a0c17%22/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@500;600;700;800&family=Hind+Vadodara:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand"><span class="gu">રાસ મંડળ</span><span class="en">Raas Mandal</span></div>
        <div class="spacer"></div>
        <div class="lang" id="langToggle" role="group" aria-label="Language">
          <button type="button" data-lang="en" lang="en" aria-pressed="true">EN</button><span aria-hidden="true">|</span><button type="button" data-lang="gu" lang="gu" aria-pressed="false">ગુ</button>
        </div>
        <button class="play-btn" id="playBtn" type="button">
          <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 1l11 6-11 6z" fill="currentColor" /></svg><span id="playLabel">Play garba</span>
        </button>
      </header>

      <main class="studio">
        <aside class="panel" id="panel" aria-label="Build your garba"></aside>
        <section class="stage" id="stage">
          <canvas id="stageCanvas" role="img" aria-label="Animated garba circles"></canvas>
          <div class="stage-tag" id="stageTag">Preview</div>
          <div class="now-step" id="nowStep"></div>
          <div class="stage-msg" id="stageMsg" role="status"></div>
        </section>
      </main>
    </div>

    <aside class="play-panel" id="playPanel" aria-label="Play controls" tabindex="-1" hidden></aside>

    <!-- YouTube player screen: positioned by main.ts under the selected song (Build) or at the bottom of the Play panel (Play). -->
    <div class="yt-screen" id="ytScreen" hidden><div id="ytFrame"></div></div>

    <!-- Shown instead of the app below 1024 px wide (laptop-only design). -->
    <div class="narrow" role="note">
      <div>
        <p class="gu">રાસ મંડળ</p>
        <h1 id="narrowTitle">Open Raas Mandal on a laptop</h1>
        <p id="narrowBody">The garba ground needs a wider screen. Open this page on a laptop or desktop, or make the window at least 1024 pixels wide.</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
